[project]
name = "llmwiki"
version = "0.4.1"
description = "LLM wiki ad albero di riassunti: indicizzazione parallela, citazioni verificate, server condiviso e MCP"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "pystray>=0.19",
    "pillow>=10",
    "pypdfium2>=5.15.2",
]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",                        # righe lunghe: decide il formato, non il linter
    "RUF001", "RUF002", "RUF003",  # caratteri tipografici italiani nei testi
    "B008",                        # File(...)/Form(...) di FastAPI negli argomenti
    "B905",                        # zip senza strict: le liste sono costruite insieme
    "SIM102", "SIM105", "SIM112", "RUF012",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
