name: Controlli

on:
  push:
    branches: [main, "claude/**"]  # anche i rami di lavoro: i test su Windows girano solo qui
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dipendenze
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests evals packaging
      - name: Test
        # Il decision model non viene scaricato in CI: i test che lo usano si saltano da soli.
        run: uv run pytest -q
