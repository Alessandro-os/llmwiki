name: Pubblicazione

# Un'etichetta "v0.5.1" caricata su GitHub costruisce l'app su Windows, la collauda e pubblica
# la versione con installatore e zip. Se test o collaudo non passano, non si pubblica niente.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test
        run: |
          uv sync
          uv run ruff check src tests evals packaging
          uv run pytest -q
      - name: Costruzione e collaudo dell'eseguibile
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Pubblicazione
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $files = "dist\LLMWiki-$version-setup.exe", "dist\LLMWiki-$version-windows-x64.zip"
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "manca $file" } }
          uv run python packaging\release_notes.py $version note.md @files
          if ($LASTEXITCODE) { throw "note della versione non scritte" }
          gh release create "${{ github.ref_name }}" @files --title "LLMWiki $version" --notes-file note.md
          if ($LASTEXITCODE) { throw "pubblicazione non riuscita" }
