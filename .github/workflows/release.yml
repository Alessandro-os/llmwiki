name: Pubblicazione

# Costruisce l'app su Windows, la collauda e pubblica la versione scritta nel codice, con
# installatore e zip. Parte a mano (Actions → Pubblicazione → Run workflow, su main) oppure
# caricando l'etichetta "v0.5.1". Se test o collaudo non passano, non si pubblica niente.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test
        run: |
          uv sync
          uv run ruff check src tests evals packaging
          uv run pytest -q
      - name: Costruzione e collaudo dell'eseguibile
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - name: Pubblicazione
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (uv run python -c "import llmwiki; print(llmwiki.__version__)").Trim()
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") { throw "l'etichetta ${{ github.ref_name }} non corrisponde alla versione $version del codice" }
          $files = "dist\LLMWiki-$version-setup.exe", "dist\LLMWiki-$version-windows-x64.zip"
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "manca $file" } }
          uv run python packaging\release_notes.py $version note.md @files
          if ($LASTEXITCODE) { throw "note della versione non scritte" }
          gh release create "v$version" @files --target "${{ github.sha }}" --title "LLMWiki $version" --notes-file note.md
          if ($LASTEXITCODE) { throw "pubblicazione non riuscita" }
